# -- Site Configuration -- (NOTE: the Development of the blog site was aided by Gemini and GLM to allow me to focus on the project itself -coding and blog creation- and less on the building of the site and learning about the indepth configurations of BlowFish and Hugo inspired by NetworkChuck https://www.youtube.com/watch?v=dnE7c0ELEH8)
# Refer to the theme docs for more details about each of these parameters.
# https://blowfish.page/docs/getting-started/

theme = "blowfish"
baseURL = "https://kevinHarianto.github.io/Improving-Hunts"
title = "Improving Hunts"
defaultContentLanguage = "en"

# pluralizeListTitles = "true" # hugo function useful for non-english languages, find out more in  https://gohugo.io/getting-started/configuration/#pluralizelisttitles

enableRobotsTXT = true
summaryLength = 0

buildDrafts = false
buildFuture = false
canonifyURLs = true

enableEmoji = true

# googleAnalytics = "G-XXXXXXXXX"

[pagination]
  pagerSize = 100

[imaging]
  anchor = 'Center'

[taxonomies]
  tag = "tags"
  category = "categories"
  author = "authors"
  series = "series"

[sitemap]
  changefreq = 'daily'
  filename = 'sitemap.xml'
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]

[related]
  threshold = 0
  toLower = false

    [[related.indices]]
        name = "tags"
        weight = 100

    [[related.indices]]
        name = "categories"
        weight = 100

    [[related.indices]]
        name = "series"
        weight = 50

    [[related.indices]]
        name = "authors"
        weight = 20

    [[related.indices]]
        name = "date"
        weight = 10

    [[related.indices]]
      applyFilter = false
      name = 'fragmentrefs'
      type = 'fragments'
      weight = 10

# -- Theme Options --
mainSections = ["posts"]

[homepage]
  layout = "custom" # or "hero"
  showRecent = true
  showRecentItems = 5

[article]
  showDate = true
  showAuthor = true
  
[params.article]
  showTableOfContents = true  # This enables the jumpable links
[markup]
  [markup.tableOfContents]
    endLevel = 6  # This sets the maximum header level to include (## to ######)
    startLevel = 1 # This ensures it starts from H2 and skips the H1 page title
[params.author]
  name = "Kevin Harianto"
[params]
  maxContentWidth = "max-w-7xl"
  enableTailwindFeatures = true
[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 10

  [[menu.main]]
    name = "Post"
    url = "/posts/"
    weight = 20
# -- Explicit Layout Overrides --
[header]
  layout = "basic"
